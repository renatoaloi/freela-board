services:
  backend:
    build:
      context: ./backend
      network: host
    container_name: freelaboard-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////storage/freelaboard.db
      - STORAGE_PATH=/storage
      - API_KEY=${API_KEY:-freela-secret-key-2024}
    volumes:
      - ./storage:/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      network: host
      args:
        VITE_API_KEY: ${VITE_API_KEY:-freela-secret-key-2024}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    container_name: freelaboard-frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

